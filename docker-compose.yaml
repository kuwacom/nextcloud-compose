services:
  nextcloud:
    image: nextcloud:${NEXTCLOUD_VERSION}
    container_name: nextcloud_app
    restart: always
    ports:
      - "${HTTP_PORT}:80"
    depends_on:
      - db
      - redis
    environment:
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=db
      - NEXTCLOUD_ADMIN_USER=${ADMIN_USERNAME}
      - NEXTCLOUD_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - NEXTCLOUD_DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PHP_MEMORY_LIMIT=2048M
      - PHP_UPLOAD_LIMIT=10G
      # 未設定だと Apache がリクエストボディを既定 1GB で打ち切り、PHP_UPLOAD_LIMIT=10G や nginx (20GB) と矛盾するため 0 (無制限) にする
      - APACHE_BODY_LIMIT=0
    volumes:
      - nextcloud:/var/www/html # Nextcloudの生成データ
      - ./nextcloud/data:/var/www/html/data # ユーザーデータ(別HDD等に設置するとよい)
      - ./nextcloud/config:/var/www/html/config # 設定ファイル
      - ./nextcloud/themes:/var/www/html/themes # カスタムテーマ
      - ./nextcloud/custom_apps:/var/www/html/custom_apps # カスタムアプリ
    networks:
      - nextcloud_network

  nextcloud-cron:
    image: nextcloud:${NEXTCLOUD_VERSION}
    container_name: nextcloud_cron
    restart: always
    entrypoint: ["/bin/bash", "/cron.sh"]
    depends_on:
      - nextcloud
    environment:
      - PHP_MEMORY_LIMIT=2048M
    volumes:
      - nextcloud:/var/www/html # Nextcloudのデータ
      - ./nextcloud/data:/var/www/html/data
      - ./nextcloud/config:/var/www/html/config
      - ./nextcloud/themes:/var/www/html/themes
      - ./nextcloud/custom_apps:/var/www/html/custom_apps
      - ./cron.sh:/cron.sh
    networks:
      - nextcloud_network

  db:
    image: postgres:18
    container_name: nextcloud_db
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      # DBのデータは .env の DB_DATA_DIR (既定 ./postgres) に置く (本番はローカルディスクを推奨)
      - ${DB_DATA_DIR:-./postgres}:/var/lib/postgresql
    networks:
      - nextcloud_network

  # 旧DB (MariaDB)。profiles 指定により通常の up では起動しない
  # MariaDB -> PostgreSQL の移行時だけ `docker compose --profile mariadb up -d mariadb` で起動する (migrate-to-postgres.sh が自動で行う)
  mariadb:
    image: mariadb:11.4
    container_name: nextcloud_mariadb
    # 移行後に stop すればホスト再起動後も止まったままにするため always にしない
    restart: unless-stopped
    profiles:
      - mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./mariadb:/var/lib/mysql # MariaDBのデータ
    networks:
      - nextcloud_network

  redis:
    image: redis:alpine
    container_name: nextcloud_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis:/data # Redisのデータ
    networks:
      - nextcloud_network

  cloudflared:
    image: cloudflare/cloudflared
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - TUNNEL_TRANSPORT_PROTOCOL=http2
    restart: always
    network_mode: service:nextcloud

  nginx:
    image: nginx:stable-alpine
    container_name: nextcloud_nginx
    restart: always
    depends_on:
      - nextcloud
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # 署名証明書を配置
      - ./nginx/certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./nginx/certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    network_mode: host

networks:
  nextcloud_network:
    driver: bridge

volumes:
  nextcloud:
